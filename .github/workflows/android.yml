name: Appli Android

on:
  push:
    branches: [main, claude/trusting-planck-jb14bs]
    paths:
      - 'android/**'
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Embarquer l'appli web dans l'APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html style.css app.js manifest.webmanifest icons android/app/src/main/assets/www/

      - name: Préparer la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_SECRET" ]; then
            # Les espaces et retours à la ligne ajoutés par un copier-coller sont ignorés.
            KEYSTORE_SECRET=$(printf '%s' "$KEYSTORE_SECRET" | tr -d ' \r\n\t')
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" || {
              echo "::error::KEYSTORE_B64 n'est pas un texte valide : recopie le fichier en entier."; exit 1; }
            if [ "$(sha256sum "$RUNNER_TEMP/release.jks" | cut -d' ' -f1)" != "d7b3868716e468dea065e9ee20ed1801370297cba04c224666326a4d1225a282" ]; then
              echo "::error::KEYSTORE_B64 est incomplet ou modifié : recopie le fichier en entier, sans rien ajouter ni enlever."; exit 1
            fi
            keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_SECRET" > /dev/null 2>&1 || {
              echo "::error::KEYSTORE_PASSWORD ne correspond pas à la clé."; exit 1; }
            echo "KEYSTORE_PASSWORD=$KEYSTORE_SECRET" >> "$GITHUB_ENV"
            echo "SIGNATURE=stable" >> "$GITHUB_ENV"
          else
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 \
              -alias majournee -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Ma journee, O=Perso, C=FR"
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "SIGNATURE=temporaire" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=majournee" >> "$GITHUB_ENV"

      - name: Fabriquer l'APK
        run: gradle -p android assembleRelease --stacktrace

      - name: Nommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ma-journee.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ma-journee-apk
          path: ma-journee.apk

      - name: Publier l'APK (lien de téléchargement fixe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNATURE" = "stable" ]; then
            NOTE="Appli Android « Ma journée », version ${GITHUB_RUN_NUMBER}. Signature stable : cette version se met à jour par-dessus la précédente, tes données sont conservées."
            FLAG=""
          else
            NOTE="Version ${GITHUB_RUN_NUMBER} avec signature TEMPORAIRE : ne pas installer pour un usage durable, une mise à jour demanderait de désinstaller l'appli et ferait perdre les données. Ajoute les secrets KEYSTORE_B64 et KEYSTORE_PASSWORD pour obtenir une signature stable."
            FLAG="--prerelease"
          fi
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest ma-journee.apk --title "Ma journée (Android)" --notes "$NOTE" --target "$GITHUB_SHA" $FLAG
